# Copy this file to config.yaml and change the values.
# The application reads the file from CONFIG_PATH (default: ./config.yaml).
# Write ${NAME} anywhere to use the environment variable NAME, so secrets
# such as webhook URLs can stay out of the file.

# The number of seconds between checks. Minimum: 10.
checkIntervalSeconds: 60

# Optional. Days every single check is kept, 2 to 400. Default: 90. The
# hourly totals behind the longer views are kept for 400 days regardless.
# retentionDays: 90

# Optional. Remove this block to disable alerts.
alerts:
  # Needed for email destinations. The password comes from SMTP_PASS.
  smtp:
    host: smtp.example.com
    port: 587
    user: smtp-user@example.com
    from: status@example.com
  # Where alerts go, for every site that has no list of its own.
  # Each entry is one of email, slack, discord, webhook with a secret,
  # pagerduty, opsgenie or ntfy.
  to:
    - email: alerts@example.com
    # - slack: https://hooks.slack.com/services/T000/B000/XXXX
    # - discord: https://discord.com/api/webhooks/000/XXXX
    # - webhook: https://example.com/statoss
    #   secret: ${WEBHOOK_SECRET}
    # - pagerduty: ${PAGERDUTY_KEY}
    # - opsgenie: ${OPSGENIE_KEY}
    #   region: eu
    # - ntfy: https://ntfy.sh/my-topic
    #   token: ${NTFY_TOKEN}
  # Optional. false keeps incident updates and maintenance notices on the
  # page and sends them nowhere. Default: true.
  # updates: true
  # Optional. Send "still down" notices this many minutes apart while a
  # monitor stays down. 0 (the default) sends none.
  repeatMinutes: 0

# Each site gets its own status page on its own hostname.
sites:
  - name: example.com
    host: status.example.com # the hostname that serves this status page
    # Optional. Where alerts link to. Default: https://<host>
    # url: https://status.example.com
    # Optional. The look of the page.
    # description: Everything example.com runs for its customers.
    # logo: logo.svg # a file next to this one, or an https address
    # favicon: favicon.png
    # accent: "#6d2a7a" # links, focus rings and buttons
    # theme: auto # auto follows the visitor's system; light or dark fixes it
    # supportUrl: mailto:help@example.com
    # Optional. Times are in the visitor's own zone; this is the zone used
    # until the browser has said which that is. Default: UTC.
    # timezone: Europe/Copenhagen
    # Optional. true asks search engines to leave the page out.
    # noindex: false
    # Optional. The view the page opens on: 24h, 7d, 90d or 1y.
    # defaultRange: 24h
    # Optional. true folds away the groups in which everything is up.
    # foldGroups: false
    # Optional. With a password the page and its endpoints are locked.
    # embedKey lets a badge or the widget in with ?key=<embedKey>.
    # password: ${STATUS_PASSWORD}
    # embedKey: ${STATUS_EMBED_KEY}
    # Optional. Percent of checks that should pass each month. The page then
    # says how much of the month's downtime budget is spent.
    # uptimeTarget: 99.9
    # Optional. A list of destinations for this site only, or false to
    # send no alerts for it.
    # alerts:
    #   to:
    #     - email: web-team@example.com
    #   repeatMinutes: 30
    monitors:
      - name: Main site
        url: https://example.com
        # Optional. Monitors with the same group are shown together.
        group: Web
        # Optional. A successful response slower than this counts as slow.
        slowThresholdMs: 1500
        # Optional. Seconds between this monitor's checks, when longer than
        # checkIntervalSeconds.
        # intervalSeconds: 300
      - name: API health
        url: https://api.example.com/health
        group: API
        # Optional. GET, HEAD, POST, PUT, PATCH or DELETE. Default: GET.
        method: GET
        # Optional. Request headers.
        headers:
          Accept: application/json
          # Authorization: Bearer ${API_TOKEN}
        # Optional. Request body, sent as-is with POST, PUT, PATCH and DELETE.
        # body: '{"ping": true}'
        # Optional. The check passes only on this exact HTTP status.
        # Without this value, the check passes on each 2xx status.
        # expectStatus: 200
        # Optional. Text the response body must contain. With
        # keywordMode: absent, the check fails when the text is found.
        keyword: '"status":"ok"'
        # keywordMode: present
      # Other kinds of monitor. Each takes a host instead of a url.
      # - name: Database
      #   type: tcp
      #   host: db.example.com
      #   port: 5432
      # - name: Mail records
      #   type: dns
      #   host: example.com
      #   record: MX # A, AAAA, CNAME, MX, TXT or NS. Default: A.
      #   expect: mail.example.com # Optional. Text an answer must contain.
      # - name: Router
      #   type: ping
      #   host: 192.0.2.1
      # - name: Certificate
      #   type: certificate
      #   host: example.com
      #   warnDays: 14 # Fails this many days before expiry. Default: 14.
      # - name: Domain
      #   type: domain
      #   host: example.com
      #   warnDays: 30 # Default: 30.
      # A heartbeat is pinged by your own job at /heartbeat/<token> and goes
      # down after two intervals in a row without a ping.
      # - name: Nightly backup
      #   type: heartbeat
      #   token: ${BACKUP_HEARTBEAT}
      #   intervalSeconds: 86400
    # Optional. Parts of the product with no check. Each has a row with a
    # state and no strip. An open incident that names one sets its state.
    # components:
    #   - name: Mobile app
    #     group: Apps
    #     description: iOS and Android
    #   - name: Card payments
    #     state: operational # operational, degraded, partial or major
    # Optional. Planned work. Checks during a window are shown but not
    # counted, and no alert goes out. Times are UTC unless a zone is given.
    # maintenance:
    #   - title: Database upgrade
    #     start: 2026-09-20T01:00:00Z
    #     end: 2026-09-20T03:00:00Z
    #     monitors: [API health] # omit for the whole site
    #     notes: The API answers with 503 for a few minutes.
