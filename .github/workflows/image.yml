name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  GHCR_IMAGE: ghcr.io/kroqdotdev/statoss-standalone

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker Hub is used only when both secrets are set. Without them the
      # image goes to GHCR alone.
      - name: Check for Docker Hub secrets
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set, so the image is pushed to GHCR only."
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names, tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME || 'unset' }}/statoss-standalone,enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=statoss-standalone
            org.opencontainers.image.description=Self-hosted status page in one container: uptime checks, SQLite storage, a public page for each site, and alerts.
            org.opencontainers.image.source=https://github.com/kroqdotdev/statoss-standalone
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=statoss-standalone
            org.opencontainers.image.description=Self-hosted status page in one container: uptime checks, SQLite storage, a public page for each site, and alerts.
            org.opencontainers.image.source=https://github.com/kroqdotdev/statoss-standalone
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
