name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? Paste the exact error message or log line.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant part of your config.yaml, with secrets removed.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or tag you run, and whether you use Docker.
    validations:
      required: true
